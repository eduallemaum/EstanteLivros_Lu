<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Estante Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">📚 Minha Estante</h1>
            <button id="open-scanner" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg shadow-lg flex items-center gap-2 transition duration-200">
                ✨ Escanear Lombadas
            </button>
        </header>

        <div id="books-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 rounded-2xl w-full max-w-lg overflow-hidden border border-gray-700 shadow-2xl">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
                <h3 class="text-lg font-bold text-purple-400 flex items-center gap-2">🔮 Scanner com IA</h3>
                <button id="close-scanner" class="text-gray-400 hover:text-gray-200 text-2xl">&times;</button>
            </div>

            <div class="p-6 space-y-6">
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-600 rounded-xl p-6 bg-gray-900/50 hover:border-purple-500 transition-colors relative group">
                    <input type="file" id="file-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="text-center space-y-2 pointer-events-none">
                        <span class="text-4xl">📁</span>
                        <p class="text-sm font-medium text-gray-300">Escolha uma foto da galeria</p>
                        <p class="text-xs text-gray-500">Funciona com JPG, PNG ou WEBP</p>
                    </div>
                </div>

                <p id="file-name" class="text-xs text-center text-purple-300 italic hidden"></p>

                <div id="scanner-error" class="bg-red-950/50 border border-red-800 text-red-300 p-4 rounded-xl text-xs space-y-1 hidden">
                    <p class="font-bold">⚠️ Houve um imprevisto:</p>
                    <p id="scanner-error-message">Não foi possível processar a imagem.</p>
                </div>

                <button id="process-btn" disabled class="w-full bg-purple-600 disabled:bg-gray-700 disabled:text-gray-400 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    Analisar Imagem com Gemini
                </button>
            </div>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('open-scanner');
        const closeBtn = document.getElementById('close-scanner');
        const modal = document.getElementById('scanner-modal');
        const fileInput = document.getElementById('file-input');
        const fileNameText = document.getElementById('file-name');
        const processBtn = document.getElementById('process-btn');
        const errorDiv = document.getElementById('scanner-error');
        const errorMessage = document.getElementById('scanner-error-message');

        let compressedBase64 = null;

        openBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
            resetScanner();
        });

        closeBtn.addEventListener('click', () => modal.classList.add('hidden'));

        // O SEGREDO: Redimensionar e comprimir no Navegador
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileNameText.innerText = `Selecionado: ${file.name}`;
            fileNameText.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            processBtn.disabled = true;
            processBtn.innerText = "Comprimindo imagem...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // Reduz para uma largura máxima de 1200px (ideal para o Gemini ler texto)
                    const MAX_WIDTH = 1200;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Transforma em JPEG super leve (qualidade 0.7)
                    compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    processBtn.disabled = false;
                    processBtn.innerText = "Analisar Imagem com Gemini";
                };
            };
        });

        processBtn.addEventListener('click', async () => {
            if (!compressedBase64) return;

            processBtn.disabled = true;
            processBtn.innerText = "IA pensando... Aguarde 🤖";
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: compressedBase64 })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Erro interno do servidor.');
                }

                alert(`Sucesso! ${result.books.length} livro(s) identificado(s) e salvo(s) na sua estante! 🎉`);
                modal.classList.add('hidden');
                window.location.reload(); // Recarrega a página para atualizar a lista do banco

            } catch (err) {
                console.error(err);
                errorMessage.innerText = "O servidor cortou a resposta ou o Gemini falhou. Verifique as credenciais e logs.";
                errorDiv.classList.remove('hidden');
                processBtn.disabled = false;
                processBtn.innerText = "Tentar Novamente";
            }
        });

        function resetScanner() {
            compressedBase64 = null;
            fileInput.value = '';
            fileNameText.classList.add('hidden');
            errorDiv.classList.add('hidden');
            processBtn.disabled = true;
            processBtn.innerText = "Analisar Imagem com Gemini";
        }
    </script>
</body>
</html>
